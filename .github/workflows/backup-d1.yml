name: backup-d1-mensal
on:
  schedule:
    - cron: '0 6 1 * *'   # dia 1 de cada mês, 06:00 UTC
  workflow_dispatch:      # ou clique em "Run workflow" quando quiser
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exportar D1
        run: npx wrangler d1 export oficial-link-erp --remote --output=backup-d1.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Guardar backup (90 dias no GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: backup-d1-${{ github.run_number }}
          path: backup-d1.sql
          retention-days: 90
